        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 10px;

        .card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 5px;

            transition: all 0.3s ease;
            overflow: hidden;

            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #9b0d31, #c41e3a, #e74c3c);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
            z-index: 1;
        }
        
        .card:hover::before {
            transform: translateX(0);
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

            height: auto;
            border-radius: 4px;

        /* 添加闪烁效果 */

            content: '';

            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
            border-radius: 10px;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
        
        .video-thumbnail {

    <script>
        // 性能优化：卡片动画延迟执行
        function animateCards() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translate3d(0, 0, 0)';
                }, index * 100); // 每张卡片延迟100ms
            });
        }

        // 防抖函数优化滚动性能
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 优化滚动事件处理
        const optimizedScrollHandler = debounce(function() {
            const backToTopBtn = document.getElementById("back-to-top");
            const scrollTop = document.body.scrollTop || document.documentElement.scrollTop;
            
            if (scrollTop > 300) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }
        }, 10);

        // 预加载关键资源
        function preloadCriticalResources() {
            const criticalImages = [
                'img/tan.jpg',
                'img/netmeasurement.jpeg',
                'img/nettesting.jpeg',
                'img/netmanagement.jpeg'
            ];
            
            criticalImages.forEach(src => {
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = src;
                document.head.appendChild(link);
            });
        }

        // DOM加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 启动卡片动画
            setTimeout(animateCards, 500);
            
            // 预加载关键资源
            preloadCriticalResources();
        });

        // 页面加载完成后的优化
        window.addEventListener('load', function() {
            // 移除加载状态
            document.body.classList.add('loaded');
            
            // 预加载下一页面资源（可选）
            const nextPageUrls = ['papers_cn.html', 'projects_cn.html'];
            nextPageUrls.forEach(url => {
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.href = url;
                document.head.appendChild(link);
            });
        });

        // 打开/关闭微信弹窗
        function openModal() {
            document.getElementById("myModal").style.display = "flex";
        }

        function closeModal(event) {
            var modal = document.getElementById("myModal");
            if (!event || event.target === modal) {
                modal.style.display = "none";
            }
        }
            
        // 优化后的滚动事件监听
        window.addEventListener('scroll', optimizedScrollHandler, { passive: true });

        // 点击回到顶部按钮
        document.getElementById("back-to-top").addEventListener("click", function(e) {
            e.preventDefault();
            // 平滑滚动回顶部
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
        
        // 播放按钮点击事件
        document.addEventListener('DOMContentLoaded', function() {
            const playIcons = document.querySelectorAll('.play-icon');
            playIcons.forEach((playIcon, index) => {
                playIcon.addEventListener('click', function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    // 根据索引打开对应的哔哩哔哩视频
                    const videoUrls = [
                        'https://www.bilibili.com/video/BV1eaRhY9E4R/',
                        'https://www.bilibili.com/video/BV1PpT2zzELD/',
                        'https://www.bilibili.com/video/BV14Z4y1H7N2/',
                        'https://www.bilibili.com/video/BV1CV411j7AX/',
                        'https://www.bilibili.com/video/BV1VMJ4zhEQF/'
                    ];
                    if (videoUrls[index]) {
                        window.open(videoUrls[index], '_blank');
                    }
                });
            });
        });
    </script>
